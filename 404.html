<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>הדף לא נמצא | AD ליווי 360</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700&family=Heebo:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-deep: #18392B;
      --green-dark: #10281F;
      --gold: #C9A96B;
      --gold-light: #D6B67A;
      --cream: #F7F4ED;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, var(--green-deep) 0%, var(--green-dark) 100%);
      font-family: 'Heebo', sans-serif;
      color: var(--cream);
      text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 480px; }
    .logo { width: 84px; height: 84px; border-radius: 50%; margin-bottom: 28px; border: 1px solid rgba(201,169,107,0.4); }
    .code {
      font-family: 'Frank Ruhl Libre', serif; font-weight: 700;
      font-size: clamp(3.5rem, 10vw, 5.5rem); color: var(--gold);
      line-height: 1; margin-bottom: 12px;
    }
    h1 {
      font-family: 'Frank Ruhl Libre', serif; font-weight: 700;
      font-size: clamp(1.4rem, 3.5vw, 1.9rem); margin-bottom: 14px;
    }
    p { color: rgba(247,244,237,0.75); font-size: 1rem; line-height: 1.7; margin-bottom: 32px; }
    .btn {
      display: inline-block; background: var(--gold); color: var(--green-dark) !important;
      text-decoration: none; padding: 14px 32px; border-radius: 30px;
      font-weight: 600; transition: background 0.3s, transform 0.2s;
    }
    .btn:hover { background: var(--gold-light); transform: translateY(-1px); }
    a:focus-visible, .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="/assets/img/logo.jpg" alt="AD ליווי 360" width="84" height="84">
    <div class="code" aria-hidden="true">404</div>
    <h1>הדף שחיפשתם לא נמצא</h1>
    <p>ייתכן שהקישור השתנה או שהדף הוסר. אפשר לחזור לעמוד הבית, או ליצור איתנו קשר ישיר אם צריך עזרה.</p>
    <a href="/" class="btn">חזרה לעמוד הבית ←</a>
  </div>
</body>
</html>
